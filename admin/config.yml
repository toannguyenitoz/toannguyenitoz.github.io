backend:
  name: github
  repo: toannguyenitoz/toannguyenitoz.github.io
  branch: main

# Đường dẫn lưu trữ hình ảnh tải lên qua CMS
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"
display_url: "https://toannguyenitoz.github.io"

collections:
  # 1. Bộ sưu tập Bài viết Blog / Kỹ thuật
  - name: "posts"
    label: "Bài Viết Kỹ Thuật"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Tiêu Đề Bài Viết", name: "title", widget: "string" }
      - { label: "Ngày Đăng", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss" }
      - { label: "Mô Tả Tóm Tắt (SEO)", name: "description", widget: "text" }
      - { label: "Danh Mục", name: "categories", widget: "list", default: ["Windows", "SysAdmin"] }
      - { label: "Thẻ Tags", name: "tags", widget: "list", required: false }
      - { label: "Ảnh Bìa", name: "thumbnail", widget: "image", required: false }
      - { label: "Nội Dung Bài Viết (Markdown)", name: "body", widget: "markdown" }

  # 2. Bộ sưu tập Video YouTube Showcase
  - name: "videos_settings"
    label: "Video YouTube Showcase"
    files:
      - label: "Danh Sách Video Hướng Dẫn"
        name: "videos"
        file: "_data/videos.yml"
        fields:
          - label: "Các Video Kỹ Thuật"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tiêu Đề Video (Tiếng Việt)", name: "title", widget: "string" }
              - { label: "Tiêu Đề Video (English)", name: "title_en", widget: "string", required: false }
              - { label: "YouTube Video ID (ví dụ: UWjAO5nLCPI)", name: "youtube_id", widget: "string" }
              - { label: "Thời Lượng (ví dụ: 10:15)", name: "duration", widget: "string" }
              - { label: "Mô Tả Ngắn (Tiếng Việt)", name: "description", widget: "text" }
              - { label: "Mô Tả Ngắn (English)", name: "description_en", widget: "text", required: false }
              - { label: "Nhãn Danh Mục", name: "category", widget: "string", default: "Windows 11" }
              - { label: "Ngày Xuất Bản", name: "published_date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", required: false }

  # 3. Bộ sưu tập Tiếp thị liên kết (Affiliates)
  - name: "affiliates_settings"
    label: "Công Cụ & Tiếp Thị Liên Kết"
    files:
      - label: "Danh Sách Khuyên Dùng"
        name: "affiliates"
        file: "_data/affiliates.yml"
        fields:
          - label: "Danh Sách Sản Phẩm / Dịch Vụ"
            name: "items"
            widget: "list"
            fields:
              - { label: "Tên Sản Phẩm / Dịch Vụ (Tiếng Việt)", name: "product_name", widget: "string" }
              - { label: "Tên Sản Phẩm (English)", name: "product_name_en", widget: "string", required: false }
              - { label: "Mô Tả Giá Trị (Tiếng Việt)", name: "description", widget: "text" }
              - { label: "Mô Tả (English)", name: "description_en", widget: "text", required: false }
              - { label: "Đường Dẫn Tiếp Thị (Affiliate URL)", name: "link", widget: "string" }
              - { label: "Chữ Nút Bấm (Tiếng Việt)", name: "cta_text", widget: "string", default: "Nhận Ưu Đãi" }
              - { label: "Chữ Nút Bấm (English)", name: "cta_text_en", widget: "string", default: "Get Deal Now" }
              - { label: "Huy Hiệu (Tiếng Việt)", name: "badge", widget: "string", required: false }
              - { label: "Huy Hiệu (English)", name: "badge_en", widget: "string", required: false }
              - { label: "Biểu Tượng (Icon SVG hoặc Emoji)", name: "icon", widget: "string", default: "🚀" }

  # 4. Quản lý Độc Giả Đăng Ký Bản Tin (Newsletter Subscribers)
  - name: "newsletter_settings"
    label: "Quản Lý Bản Tin & Độc Giả"
    files:
      - label: "Danh Sách Email Đăng Ký (Newsletter)"
        name: "subscribers"
        file: "_data/subscribers.yml"
        fields:
          - label: "Độc Giả Đã Đăng Ký"
            name: "subscribers"
            widget: "list"
            fields:
              - { label: "Địa Chỉ Email", name: "email", widget: "string" }
              - { label: "Ngày Đăng Ký", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD" }
              - { label: "Trạng Thái", name: "status", widget: "select", options: ["active", "unsubscribed"], default: "active" }

  # 5. Free Course Voucher Management
  - name: "voucher_settings"
    label: "🎁 Voucher Khóa Học Miễn Phí"
    files:
      - label: "Danh Sách Voucher Đang Hoạt Động"
        name: "vouchers"
        file: "_data/vouchers.yml"
        fields:
          - label: "Vouchers"
            name: "root"
            widget: "list"
            fields:
              - { label: "ID (slug khóa học)", name: "id", widget: "string" }
              - { label: "Tên Khóa Học", name: "title", widget: "string" }
              - { label: "Mô Tả Ngắn", name: "description", widget: "text", required: false }
              - { label: "Ảnh Thumbnail (URL)", name: "image", widget: "string", required: false }
              - { label: "Giảng Viên", name: "instructor", widget: "string", required: false }
              - { label: "Rating (0-5)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, required: false }
              - { label: "Số Học Viên", name: "students", widget: "number", required: false }
              - { label: "Cấp Độ", name: "level", widget: "string", required: false }
              - { label: "Thời Lượng", name: "duration", widget: "string", required: false }
              - { label: "Số Bài Giảng", name: "lectures", widget: "number", required: false }
              - { label: "Mã Coupon", name: "coupon_code", widget: "string", required: false }
              - { label: "Link Udemy (có coupon)", name: "coupon_url", widget: "string" }
              - { label: "Link Udemy (gốc)", name: "udemy_url", widget: "string" }
              - { label: "Nguồn", name: "source", widget: "select", options: ["tutorialbar", "real.discount", "coursevania", "couponami", "manual"], default: "manual" }
              - { label: "Ngày Lấy Voucher", name: "fetched_at", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD" }
              - { label: "Danh Mục (tags)", name: "categories", widget: "list", required: false }

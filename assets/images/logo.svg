<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="100%" height="100%">
  <defs>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="ozBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Hexagon / Terminal Symbol -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Outer -->
    <polygon points="35,2 65,19 65,53 35,70 5,53 5,19" fill="#090D16" stroke="url(#azureGrad)" stroke-width="3"/>
    
    <!-- Cloud & Terminal Hybrid Path -->
    <path d="M22,38 L30,44 L22,50" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="33" y1="50" x2="44" y2="50" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Pulse Node -->
    <circle cx="50" cy="24" r="4.5" fill="#10B981" filter="url(#glow)"/>
  </g>

  <!-- Text: IT SUPPORT WITH TOAN -->
  <g transform="translate(90, 36)">
    <!-- Subheading / Monogram -->
    <text x="0" y="0" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="3.5">IT SUPPORT WITH TOAN</text>
    
    <!-- Main Brand Name -->
    <text x="0" y="30" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Toan Nguyen</text>
    
    <!-- OZ Tech Badge -->
    <rect x="175" y="10" width="58" height="24" rx="6" fill="url(#ozBadgeGrad)"/>
    <text x="183" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1">IT OZ</text>
  </g>
</svg>

name: Weekly Tech Dispatch Newsletter Automation

on:
  schedule:
    # Chạy tự động lúc 08:00 sáng Thứ Hai (Giờ Adelaide / 22:30 UTC Chủ Nhật)
    - cron: '30 22 * * 0'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để gửi thử bất cứ lúc nào

permissions:
  contents: read

jobs:
  dispatch-newsletter:
    name: Dispatch Weekly Tech Newsletter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Provider Newsletter Engine
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY_BACKUP_1: ${{ secrets.RESEND_API_KEY_BACKUP_1 }}
          RESEND_API_KEY_BACKUP_2: ${{ secrets.RESEND_API_KEY_BACKUP_2 }}
          SUPABASE_URL: "https://imkgmhdqjloovqvsmifu.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_scdg680eJ1137pIwWz3uFQ_sK_a-TcL"
          NEWSLETTER_SENDER_EMAIL: ${{ secrets.NEWSLETTER_SENDER_EMAIL }}
        run: |
          python scripts/send_weekly_newsletter.py

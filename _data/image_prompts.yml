- id: casual-to-executive-headshot
  title: Casual Desk Snapshot to Executive LinkedIn Headshot
  category: Portrait & Headshot
  slash_command: /portrait
  models:
  - Google Imagen 3 (Gemini)
  - ChatGPT GPT-4o Vision
  aspect_ratio: '1:1'
  before_image: /assets/images/prompts/executive_headshot_before.jpg
  after_image: /assets/images/prompts/executive_headshot_after.jpg
  description: Transforms a casual indoor selfie into an elite corporate executive portrait, replacing casual wear with a bespoke tailored Italian suit while retaining 100% facial identity.
  prompt: '/portrait --input:[original_image]

    --preserve-identity:100%

    --outfit:"tailored dark navy Italian wool suit jacket, crisp pressed white dress shirt, structured collar, subtle royal blue silk necktie"

    --posture:"confident, natural upright executive stance with a friendly approachable professional smile"

    --background:"modern architectural corporate headquarters glass atrium, floor-to-ceiling windows, creamy soft natural bokeh with city light orbs"

    --camera-optics:"85mm f/1.4 prime lens, shallow depth of field, sharp focus on facial features, realistic skin pores and texture"

    --lighting:"cinematic three-point studio lighting, soft key light from 45 degrees, subtle cool rim light separating shoulders from background"

    --exclude:"plastic skin, AI airbrushing, oversaturated colors, altered jawline, distorted teeth"

    --aspect-ratio:1:1 --model:imagen-3'
  tags:
  - Portrait
  - LinkedIn
  - Executive
  - Corporate
  - Identity-Preserved
- id: street-photo-to-ghibli-anime
  title: Real Street Cafe to Studio Ghibli Anime Watercolor
  category: Style Remix & Anime
  slash_command: /remix
  models:
  - ChatGPT (DALL-E 3)
  - Google Imagen 3
  aspect_ratio: '1:1'
  before_image: /assets/images/prompts/cafe_street_before.jpg
  after_image: /assets/images/prompts/ghibli_cafe_after.jpg
  description: Remixes an ordinary street cafe photograph into a whimsical, hand-painted Studio Ghibli watercolor anime masterpiece with lush foliage and dreamy clouds.
  prompt: '/remix --input:[original_image]

    --target-style:"traditional 1990s Studio Ghibli hand-painted anime animation cel, Hayao Miyazaki aesthetic"

    --medium:"gouache and watercolor on cold-press textured paper with gentle organic pigment bleeding and delicate ink contours"

    --elements:"ivy vines climbing warm terracotta brick walls, painterly vintage bicycle with wicker basket, fluffy cumulus clouds in an azure sky"

    --lighting:"warm golden afternoon sunbeams filtering through lush tree canopies, dappled light patterns across cobblestones"

    --atmosphere:"peaceful, nostalgic, cozy fairytale European town"

    --palette:"warm terracotta, olive green, cream, cornflower blue, golden ochre"

    --exclude:"3D CGI render, photorealism, glossy plastic textures, high-frequency digital noise"

    --aspect-ratio:1:1 --model:dall-e-3'
  tags:
  - Anime
  - Studio Ghibli
  - Watercolor
  - Remix
  - Nostalgic

  - cmd: /polaroid
    title: Instant Polaroid SX-70 Print
    desc: Frames the image inside a classic vintage white-bordered Polaroid print
      with creamy chemical color development.
    tag: Instant Film
  - cmd: /fisheye
    title: 90s Skate Culture Fisheye Lens
    desc: Distorts the frame using an extreme 8mm ultra-wide fisheye barrel distortion
      with dramatic skate video perspective.
    tag: Action
  - cmd: /cinematic
    title: 35mm Anamorphic Film Still
    desc: Renders the shot as a movie still with 2.39:1 widescreen aspect ratio, teal-and-orange

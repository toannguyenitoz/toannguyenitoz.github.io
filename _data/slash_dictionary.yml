- category: Double Exposure & Viral Portrait FX
  icon: ✨
  commands:
  - cmd: /DOUBLE
    title: Mystical Rainforest Stream Double Exposure
    desc: Seamlessly blends portrait contours into a mossy enchanted rainforest canopy
      with sunbeams filtering down over a rocky mountain brook.
    tag: Viral Video
  - cmd: /CINEMATICDOUBLE
    title: Tokyo Night Skyline & Traffic Trails
    desc: Fuses the subject with nocturnal Tokyo skyscrapers, neon-lit high-rises,
      and streaming vehicle long-exposure headlight trails.
    tag: Viral Video
  - cmd: /EDITORIALDOUBLE
    title: Alpine Sunset Mountain & Pine Canyon
    desc: High-fashion editorial double exposure merging the portrait with snow-capped
      Alpine peaks, sunset clouds, and an emerald canyon river.
    tag: Viral Video
  - cmd: /NATUREDOUBLE
    title: Sunlit Giant Redwood Forest Canopy
    desc: Infuses the portrait hair and silhouette with ancient redwood giants, lush
      fern undergrowth, and golden morning sun rays.
    tag: Viral Video
  - cmd: /FLORALDOUBLE
    title: Radiant Golden Hour Metropolis
    desc: Combines the portrait with a warm golden sunset city skyline, illuminated
      expressway ribbons, and penthouse panoramic windows.
    tag: Viral Video
  - cmd: /CITYDOUBLE
    title: Cyber Blue Urban Night Avenue
    desc: Projects a futuristic cyan-blue city boulevard with towering architecture
      and speeding taxi light trails through the subject.
    tag: Viral Video
  - cmd: /SEADOUBLE
    title: Golden Coastal Sunset Waves & Surf
    desc: Wraps the portrait silhouette in golden sunset ocean tides, coastal cliffs,
      and white foam sea waves.
    tag: Viral Video
  - cmd: /COSMICDOUBLE
    title: Deep Nebula & Stellar Constellation
    desc: Transposes a glowing cosmic nebula, violet spiral galaxies, and stardust
      through the profile of the portrait.
    tag: Cosmic
- category: Miniature & Surreal Dioramas
  icon: 🏗️
  commands:
  - cmd: /tinyworkers
    title: Miniature Product Workers
    desc: A team of miniature construction workers in hardhats and safety gear building,
      repairing, or painting the uploaded product with tiny ladders, scaffolding,
      and cranes.
    tag: Trending
  - cmd: /lego
    title: LEGO Plastic Brick Rebuild
    desc: Recreates the subject or product entirely from colorful authentic LEGO plastic
      bricks with realistic stud textures.
    tag: Toy & Craft
  - cmd: /isometric
    title: 3D Isometric Diorama
    desc: Converts the scene into a miniature 3D isometric floating island diorama
      with clean edges and soft studio lighting.
    tag: 3D & Scene
  - cmd: /diorama
    title: Glass Cube World
    desc: Places the uploaded subject inside a miniature enchanted diorama encased
      in a crystal-clear acrylic cube.
    tag: Miniature
  - cmd: /claymation
    title: Plasticine Clay Stop-Motion
    desc: Transforms the subject into a handcrafted Aardman-style clay animation puppet
      with visible fingerprint textures.
    tag: Stop-Motion
  - cmd: /knitted
    title: Crocheted Wool Yarn
    desc: Reimagines the subject as a cozy hand-knitted woolen yarn plush toy with
      detailed stitch patterns.
    tag: Textile
  - cmd: /origami
    title: Folded Papercraft Sculpture
    desc: Rebuilds the subject using crisp geometric Japanese origami folded paper
      with delicate shadows.
    tag: Papercraft
  - cmd: /chibi
    title: Cute Chibi Miniature
    desc: Redraws characters or subjects in adorable Japanese chibi proportions with
      oversized expressive eyes.
    tag: Cute & Anime
  - cmd: /funko
    title: Funko Pop Vinyl Collectible
    desc: Turns any person or character into a stylized Funko Pop vinyl figurine inside
      its numbered retail packaging.
    tag: Collectible
  - cmd: /snowglobe
    title: Enclosed Winter Snowglobe
    desc: Encapsulates the subject inside a classic glass water snowglobe with swirling
      glittery snowflakes.
    tag: Seasonal
  - cmd: /plushie
    title: Fluffy Stuffed Plushie
    desc: Converts the subject into an adorable ultra-soft plush toy with plush velvet
      fur and stitched embroidery.
    tag: Plush & Toy
  - cmd: /woodtoy
    title: Minimalist Nordic Wooden Toy
    desc: Reimagines the subject as a smooth carved Scandinavian wooden toy with rounded
      edges and matte natural varnish.
    tag: Woodcraft
  - cmd: /microchip
    title: Silicon Microchip City
    desc: Transforms the subject into an intricate futuristic metropolis built directly
      on a silicon computer circuit board.
    tag: Microtech
- category: Product & Commercial Advertising
  icon: 🔬
  commands:
  - cmd: /splash
    title: High-Speed Liquid Splash
    desc: Surrounds the uploaded product with dynamic bursting crystal water, milk,
      or beverage splashes and flying droplets.
    tag: Commercial
  - cmd: /exploded
    title: Radial Exploded Teardown
    desc: Disassembles mechanical gadgets, cameras, or sneakers with all internal
      parts floating symmetrically along a central axis.
    tag: Technical
  - cmd: /xray
    title: Transparent X-Ray Schematic
    desc: Renders the product with a see-through translucent casing revealing glowing
      holographic internal circuit boards and wiring.
    tag: Sci-Fi Tech
  - cmd: /flatlay
    title: Knolling Component Flatlay
    desc: Arranges all individual components, accessories, and tools in a perfectly
      aligned 90-degree knolling overhead grid.
    tag: Studio
  - cmd: /ghostmannequin
    title: Invisible Ghost Mannequin
    desc: Displays clothing or apparel in 3D hollow form as if worn by an invisible
      mannequin for e-commerce catalogs.
    tag: Fashion E-com
  - cmd: /pedestal
    title: Luxury Marble Pedestal
    desc: Places the product on a cylindrical travertine marble pedestal with dramatic
      soft three-point studio lighting.
    tag: E-commerce
  - cmd: /packaging
    title: Retail Shelf Box Packaging
    desc: Generates premium branded unboxing packaging and corrugated cardboard shipping
      box for the uploaded product.
    tag: Packaging
  - cmd: /macro
    title: 100mm Extreme Macro Detail
    desc: Captures an ultra-close-up 100mm macro shot highlighting microscopic material
      textures, threads, and craftsmanship.
    tag: Macro
  - cmd: /floating
    title: Zero-Gravity Levitation
    desc: Causes the product and related ingredients or accessories to levitate weightlessly
      in mid-air with soft drop shadows.
    tag: Surreal
  - cmd: /billboard
    title: Times Square 3D Anamorphic Display
    desc: Presents the product bursting out of a curved massive 3D LED digital billboard
      in Tokyo Shibuya or Times Square.
    tag: Out-of-Home
  - cmd: /drop
    title: Liquid Surface Drop Impact
    desc: Captures the millisecond the product impacts a calm liquid surface, creating
      a perfect crown splash ring.
    tag: High-Speed
  - cmd: /refraction
    title: Prism Crystal Light Refraction
    desc: Baths the product in ethereal rainbow light prisms and spectral optical
      flares passing through faceted crystal.
    tag: Lighting
  - cmd: /monolith
    title: Black Volcanic Sand Monolith
    desc: Displays the product on a dramatic black basalt monolith rising from Icelandic
      black volcanic sand under moody skies.
    tag: Atmospheric

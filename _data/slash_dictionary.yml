    tag: Sculpture
  - cmd: /smoke
    title: Swirling Ethereal Smoke Silhouette
    desc: Dissolves the contours of the subject into multi-colored billowing ethereal
      smoke clouds against a black void.
    tag: Abstract
- category: Futuristic, VFX & Sci-Fi
  icon: ⚡
  commands:
  - cmd: /cyberpunk
    title: Rain-Soaked Cyberpunk 2088
    desc: Infuses the image with futuristic neon billboards, dark rain-slicked asphalt,
      holographic ads, and teal-magenta lighting.
    tag: Sci-Fi
  - cmd: /steampunk
    title: Victorian Brass Clockwork
    desc: Retrofits the subject with intricate brass gears, copper pipes, pressure
      gauges, and billowing steam.
    tag: Retro Sci-Fi
  - cmd: /synthwave
    title: 1984 Retrowave Sunset Grid
    desc: Applies an 80s retro synthwave aesthetic with purple-orange wireframe digital
      grid, chrome typography, and palm trees.
    tag: 80s Retro
  - cmd: /hologram
    title: Glowing Blue 3D Hologram
    desc: Projects the subject as a semi-transparent flickering cyan sci-fi hologram
      beam with scanlines and glitch artifacts.
    tag: Holographic
  - cmd: /matrix
    title: Digital Rain Matrix Code
    desc: Constructs the subject out of descending streams of luminous emerald green
      digital binary glyphs on a pitch-black background.
    tag: Hacker
  - cmd: /apocalypse
    title: Post-Apocalyptic Overgrown Ruin
    desc: Weathers the subject into a centuries-old relic covered in moss, rusted
      metal, wild climbing vines, and cracked concrete.
    tag: Wasteland
  - cmd: /solarpunk
    title: Solarpunk Eco-Utopian Future
    desc: Reimagines the scene in an eco-futuristic world of curved glass architecture,
      rooftop gardens, and clean solar technology.
    tag: Solarpunk
  - cmd: /spacesuit
    title: Orbital Spacewalk Astronaut
    desc: Suits the subject in high-tech NASA extravehicular gear floating in zero-gravity
      with Earth reflected in the gold visor.
    tag: Cosmic
  - cmd: /cybernetic
    title: Titanium Cybernetic Augmentation
    desc: Equips the subject with bionic carbon-fiber limbs, exposed hydraulic servos,
      and glowing optic nerve implants.
    tag: Cyborg
  - cmd: /multiverse
    title: Dimensional Multiverse Glitch
    desc: Splits the subject into multiple shifting quantum realities, each rendered
      in a different art style and dimension.
    tag: VFX
- category: Art, Painting & Illustration
  icon: 🎨
  commands:
  - cmd: /ghibli
    title: Studio Ghibli Watercolor Cel
    desc: Converts photos into a nostalgic, hand-painted anime animation cel in the
      warm, whimsical aesthetic of Hayao Miyazaki.
    tag: Anime
  - cmd: /anime
    title: Modern Shonen Sakuga Anime
    desc: Transforms subjects into high-octane modern Japanese anime artwork with
      bold dynamic action lines and vibrant cel-shading.
    tag: Manga
  - cmd: /watercolor
    title: Fluid Wet-on-Wet Watercolor
    desc: Re-renders the scene as a soft watercolor painting on cold-press textured
      paper with organic pigment bleeding.
    tag: Traditional
  - cmd: /oilpainting
    title: Impressionist Textured Oil
    desc: Translates the image into a rich classical oil painting with visible palette
      knife strokes and heavy impasto texture.
    tag: Fine Art
  - cmd: /sketch
    title: Architectural Pencil & Ink Sketch
    desc: Converts the image into a detailed hand-drawn architectural perspective
      sketch with crosshatching on drafting parchment.
    tag: Drawing
  - cmd: /vector
    title: Clean Minimalist SVG Vector
    desc: Simplifies complex scenes into a modern flat graphic vector illustration
      with smooth clean shapes and contemporary colors.
    tag: Graphic Design
  - cmd: /popart
    title: Andy Warhol 1960s Pop Art
    desc: Reinterprets the subject as a 4-panel screenprint with bold contrasting
      silkscreen inks, halftone dots, and vintage newsprint.
    tag: 60s Vintage
  - cmd: /pixelart
    title: 16-Bit Retro Arcade Pixel Art
    desc: Recreates the image using an authentic 16-bit color-limited pixel art grid
      reminiscent of classic SNES and arcade games.
    tag: Retro Gaming
  - cmd: /comic
    title: Vintage Graphic Novel Comic
    desc: Transforms the photo into a classic vintage American comic book panel with
      Ben-Day dot shading and black inked outlines.
    tag: Comic
  - cmd: /graffiti
    title: Urban Street Art Spray Mural
    desc: Paints the subject as a vibrant hip-hop street art mural on a brick wall
      with stencils, markers, and paint drips.
    tag: Street Art
  - cmd: /charcoal
    title: High-Contrast Charcoal Drawing
    desc: Sketches the subject with expressive smudged vine charcoal on textured off-white
      heavy art paper.
    tag: Traditional
  - cmd: /ukiyo-e
    title: Japanese Woodblock Ukiyo-e Print
    desc: Reinterprets the scene in the style of Hokusai with distinctive woodblock
      ink outlines and wave patterns.
    tag: Heritage
- category: Photography, Fashion & Enhancement
  icon: 📸
  commands:
  - cmd: /portrait
    title: Executive LinkedIn Headshot
    desc: Upgrades casual selfies into an executive headshot in tailored formal attire
      with soft corporate office bokeh background.
    tag: Headshot
  - cmd: /editorial
    title: Vogue High-Fashion Editorial Cover
    desc: Transforms the subject into a luxury fashion magazine cover story with high-contrast
      studio rim lighting and haute couture styling.
    tag: Fashion
  - cmd: /restore
    title: Historical Photo Restore & Colorize
    desc: Removes scratches, creases, and fading from vintage antique photographs,
      adding natural realistic skin color and clarity.
    tag: Restoration
  - cmd: /outpaint
    title: 16:9 Panoramic Vista Outpainting
    desc: Seamlessly expands the canvas beyond a tight photo frame into a panoramic
      landscape matching the original scene.
    tag: Expansion
  - cmd: /vintage
    title: 1970s Warm Film Aesthetic
    desc: Imbues the photo with warm Kodachrome 64 tones, gentle analog film grain,
      subtle lens flare, and muted 70s nostalgia.

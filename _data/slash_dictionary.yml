  - cmd: /monochrome
    title: Classic Film Noir Monochrome
    desc: High-contrast black-and-white photography with Venetian blind shadow slats
      and smoky atmosphere.
    tag: Noir
  - cmd: /doubleexposure
    title: Nature Silhouette Double Exposure
    desc: Blends the subject silhouette with an evergreen pine forest, misty mountain
      ridge, and starry night sky.
    tag: Artistic
  - cmd: /drone
    title: Top-Down 90° Aerial Drone View
    desc: Takes a perpendicular bird-eye perspective from 200 meters above, revealing
      geometric environment patterns.
    tag: Aerial
  - cmd: /nightvision
    title: Tactical Phosphor Night-Vision Scope
    desc: Views the target through a green military GEN-3 night-vision optic with
      digital HUD readouts.
    tag: Tactical

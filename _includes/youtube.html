{% comment %}
  Component: youtube.html
  Sử dụng: {% include youtube.html id="dQw4w9WgXcQ" title="Tiêu đề video" %}
{% endcomment %}
<div class="video-responsive-wrapper">
  <div class="video-container-16-9">
    <iframe
      src="https://www.youtube-nocookie.com/embed/{{ include.id }}"
      title="{{ include.title | default: 'YouTube Video' | escape }}"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      loading="lazy"
      class="youtube-iframe">
    </iframe>
  </div>
  {% if include.caption %}
  <p class="video-caption">{{ include.caption }}</p>
  {% endif %}
</div>

<!-- Tech Newsletter Subscription Card (Unified Enterprise Style) -->
<div class="col-section-block newsletter-section-block">
  <div class="col-header-bar">
    <div class="col-header-title">
      <span class="col-icon-mark">⚡</span>
      <div>
        <h2 class="col-title">Weekly Tech Dispatch</h2>
        <p class="col-desc">Practical SysAdmin tips &amp; Cloud scripts</p>
      </div>
    </div>
    <span class="col-status-pill status-weekly">Weekly</span>
  </div>

  <div class="newsletter-card-inner">
    <p class="newsletter-desc-concise">
      Get battle-tested PowerShell one-liners, Windows Server quick-fixes, and Azure blueprints delivered straight to your inbox. No spam, ever.
    </p>

    <form class="newsletter-form-compact" id="newsletterForm" onsubmit="return window.handleNewsletterSubmit(event)">
      <div class="newsletter-input-group">
        <input 
          type="email" 
          id="newsletterEmail" 
          class="newsletter-input-field" 
          placeholder="Enter your email address..." 
          required 
          autocomplete="email"
        >
        <button type="submit" class="btn-newsletter-subscribe" id="newsletterSubmitBtn">
          <span>Subscribe</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="newsletter-feedback" id="newsletterFeedback" style="display: none;"></div>
    </form>

    <div class="newsletter-micro-footer">
      <span>🔒 Privacy prioritized. Unsubscribe anytime.</span>
    </div>
  </div>
</div>

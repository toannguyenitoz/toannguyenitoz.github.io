email: "theodorenguyensa@gmail.com"
description: "Enterprise Systems Administration, Windows Server, Active Directory, Microsoft 365, Azure Cloud Architecture, and PowerShell Automation by Toan Nguyen (Toan Nguyen IT OZ), Adelaide, South Australia."
baseurl: ""
url: "https://toannguyenitoz.github.io"

# Author Information
author:
  name: "Toan Nguyen"
  brand: "IT Support With Toan (Toan Nguyen IT OZ)"
  title: "Systems Administrator & Cloud Infrastructure Specialist"
  bio: "Enterprise Systems Administrator with 20+ years of mission-critical IT support experience in regulated banking and cloud environments. Specializing in Windows Server, Active Directory, Microsoft 365, Azure Cloud, and PowerShell infrastructure automation."
  location: "Adelaide, South Australia"
  email: "theodorenguyensa@gmail.com"
  github: "toannguyenitoz"
  linkedin: "toan-nguyen-it-oz"
  youtube_channel: "ITSupportwithToan_Adl"
  youtube_name: "IT Support with Toan"
  avatar: "/assets/images/toan-avatar.jpg"
  certifications:
    - "Microsoft Certified: Azure Fundamentals (AZ-900)"
    - "Silver Medalist - Cloud Computing (WorldSkills Australia SA 2026)"
    - "Certificate IV in Information Technology (Systems Administration) - TAFE SA"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

# Plugins supported natively by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Toan Nguyen"

# Exclude list
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .git
  - .gitignore
  - README.md
